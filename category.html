<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AASHVI | Categories</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand-primary: #667eea;
      --brand-secondary: #764ba2;
      --brand-dark: #181623;
      --brand-accent: #ffb400;
      --text-dark: #222;
      --text-muted: #777;
      --radius-lg: 18px;
      --shadow-soft: 0 10px 30px rgba(0,0,0,0.08);
      --shadow-strong: 0 20px 45px rgba(0,0,0,0.18);
    }

    body {
      font-family: "Poppins", sans-serif;
      background: #f8f7ff;
    }

    /* NAVBAR */
    .navbar {
      background: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    .navbar-brand {
      font-weight: 700;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-link {
      font-weight: 500;
      color: #555 !important;
      padding: 0.5rem 1rem !important;
    }

    .nav-link:hover, .nav-link.active { color: var(--brand-primary) !important; }

    .nav-icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(102, 126, 234, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }

    .nav-icon-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ff3366;
      color: white;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 10px;
    }

    /* CATEGORY HERO */
    .category-hero {
      height: 320px;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      box-shadow: var(--shadow-strong);
      margin-top: 20px;
    }

    .category-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .category-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(10,8,30,0.85), rgba(10,8,30,0.1));
    }

    .category-hero-content {
      position: absolute;
      left: 40px;
      bottom: 40px;
      color: white;
    }

    .category-hero h1 {
      font-size: 2.4rem;
      font-weight: 700;
    }

    .category-hero p {
      max-width: 420px;
      opacity: 0.9;
      margin-top: 8px;
    }

    /* ALL CATEGORIES GRID */
    .all-categories-section {
      margin-top: 40px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .section-title h2 {
      font-weight: 700;
      font-size: 1.8rem;
      position: relative;
      display: inline-block;
      padding-bottom: 10px;
    }

    .section-title h2::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--brand-primary), var(--brand-secondary));
      border-radius: 999px;
    }

    .category-card {
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: relative;
      min-height: 200px;
      box-shadow: var(--shadow-soft);
      transition: 0.3s;
      cursor: pointer;
    }

    .category-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-strong);
    }

    .category-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      transition: 0.4s;
    }

    .category-card:hover img { transform: scale(1.08); }

    .category-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    }

    .category-card-content {
      position: absolute;
      bottom: 15px;
      left: 15px;
      right: 15px;
      color: #fff;
    }

    .category-card-name {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .category-card-count {
      font-size: 0.8rem;
      opacity: 0.85;
    }

    /* PRODUCT GRID */
    .product-card {
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: white;
      box-shadow: var(--shadow-soft);
      transition: 0.25s ease;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-strong);
    }

    .product-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      transition: 0.4s ease;
    }

    .product-card:hover img { transform: scale(1.07); }

    .product-body { padding: 14px; }

    .product-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .product-price {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--brand-primary);
    }

    .product-rating {
      color: #f6a800;
      font-size: 0.85rem;
    }

    .btn-add {
      border-radius: 999px;
      padding: 7px 12px;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
      color: #fff;
      border: none;
      font-size: .85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      box-shadow: 0 10px 22px rgba(102,126,234,0.45);
      cursor: pointer;
    }

    .btn-add:hover { transform: translateY(-2px); }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 4rem;
      color: #ddd;
      margin-bottom: 20px;
      display: block;
    }

    .toast-box {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 9999;
      display: none;
    }

    .toast-inner {
      background: #111827;
      padding: 12px 16px;
      border-radius: 999px;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }

    .toast-inner i { color: #22c55e; }

    .breadcrumb-custom {
      background: white;
      padding: 15px 20px;
      border-radius: 12px;
      margin-top: 20px;
      box-shadow: var(--shadow-soft);
    }

    .breadcrumb-custom a {
      color: var(--brand-primary);
      text-decoration: none;
    }

    .spinner-container {
      text-align: center;
      padding: 60px;
    }
  </style>
</head>

<body>

  <!-- NAV -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">AASHVI</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-3 me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="product.html">All Products</a></li>
          <li class="nav-item"><a class="nav-link active" href="category.html">Categories</a></li>
        </ul>

        <div class="d-flex align-items-center">
          <div class="nav-icon-btn" onclick="window.location.href='cart.html'">
            <i class="fa-solid fa-bag-shopping"></i>
            <span class="nav-icon-badge" id="cartCountBadge">0</span>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- Breadcrumb -->
    <div class="breadcrumb-custom" id="breadcrumb">
      <a href="index.html">Home</a> / <span id="breadcrumbText">Categories</span>
    </div>

    <!-- Dynamic Content: Either Category Hero + Products OR All Categories -->
    <div id="pageContent">
      <div class="spinner-container">
        <div class="spinner-border text-primary"></div>
        <p class="mt-3">Loading...</p>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toastBox" class="toast-box"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const API_URL = "http://localhost:5000/api";

    document.addEventListener("DOMContentLoaded", () => {
      initUserId();
      updateCartBadge();
      loadPage();
    });

    function initUserId() {
      if (!localStorage.getItem("userId")) {
        localStorage.setItem("userId", "guest_" + Date.now());
      }
    }

    function getImageUrl(img) {
      if (!img) return "https://via.placeholder.com/400x400?text=No+Image";
      if (img.startsWith("http") || img.startsWith("data:")) return img;
      return `http://localhost:5000/${img}`;
    }

    function showToast(msg) {
      const box = document.getElementById("toastBox");
      box.innerHTML = `<div class="toast-inner"><i class="fa-solid fa-check-circle"></i><span>${msg}</span></div>`;
      box.style.display = "block";
      setTimeout(() => box.style.display = "none", 2000);
    }

    // LOAD PAGE
    async function loadPage() {
      const params = new URLSearchParams(window.location.search);
      const categoryName = params.get("category");

      if (categoryName) {
        // Show specific category with its products
        document.getElementById("breadcrumbText").innerHTML = `<a href="category.html">Categories</a> / <strong>${decodeURIComponent(categoryName)}</strong>`;
        await loadCategoryPage(categoryName);
      } else {
        // Show all categories
        document.getElementById("breadcrumbText").textContent = "All Categories";
        await loadAllCategories();
      }
    }

    // LOAD SPECIFIC CATEGORY
    async function loadCategoryPage(categoryName) {
      const content = document.getElementById("pageContent");

      try {
        // Get category info
        const catRes = await fetch(`${API_URL}/categories`);
        const catData = await catRes.json();

        const category = catData.categories.find(c => c.name.toLowerCase() === categoryName.toLowerCase());

        if (!category) {
          content.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i><h4>Category not found</h4><p>The category "${categoryName}" does not exist.</p><a href="category.html" class="btn btn-primary mt-3">View All Categories</a></div>`;
          return;
        }

        // Get products for this category
        const prodRes = await fetch(`${API_URL}/products/by-category/${encodeURIComponent(categoryName)}`);
        const prodData = await prodRes.json();

        let productsHTML = '';

        if (!prodData.products || prodData.products.length === 0) {
          productsHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><h4>No products in this category</h4><p>Check back later or browse other categories.</p><a href="category.html" class="btn btn-primary mt-3">View All Categories</a></div>`;
        } else {
          productsHTML = `
            <h3 class="fw-bold mb-4">${prodData.products.length} Product${prodData.products.length !== 1 ? 's' : ''} in ${category.name}</h3>
            <div class="row g-4">
              ${prodData.products.map(p => renderProductCard(p)).join('')}
            </div>
          `;
        }

        content.innerHTML = `
          <!-- Category Hero -->
          <div class="category-hero">
            <img src="${getImageUrl(category.image)}" alt="${category.name}" onerror="this.src='https://via.placeholder.com/1200x320?text=Category'">
            <div class="category-hero-overlay"></div>
            <div class="category-hero-content">
              <h1>${category.name}</h1>
              <p>${category.description || 'Explore our premium collection in this category.'}</p>
            </div>
          </div>

          <!-- Products -->
          <section class="mt-5 mb-5">
            ${productsHTML}
          </section>
        `;

      } catch (err) {
        console.error(err);
        content.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h4>Error loading category</h4><p>Please try again later.</p></div>`;
      }
    }

    // LOAD ALL CATEGORIES
    async function loadAllCategories() {
      const content = document.getElementById("pageContent");

      try {
        const [catRes, prodRes] = await Promise.all([
          fetch(`${API_URL}/categories`),
          fetch(`${API_URL}/products`)
        ]);

        const catData = await catRes.json();
        const prodData = await prodRes.json();

        if (!catData.success || !catData.categories || catData.categories.length === 0) {
          content.innerHTML = `<div class="empty-state"><i class="fas fa-th-large"></i><h4>No categories yet</h4><p>Categories will appear here once added.</p></div>`;
          return;
        }

        // Count products per category
        const productCounts = {};
        if (prodData.products) {
          prodData.products.forEach(p => {
            const cat = (p.category || '').toLowerCase();
            productCounts[cat] = (productCounts[cat] || 0) + 1;
          });
        }

        content.innerHTML = `
          <section class="all-categories-section mb-5">
            <div class="section-title">
              <h2>All Categories</h2>
              <p class="text-muted mt-2">Browse our curated collections</p>
            </div>

            <div class="row g-4">
              ${catData.categories.map(c => {
                const count = productCounts[c.name.toLowerCase()] || 0;
                return `
                  <div class="col-lg-3 col-md-4 col-sm-6">
                    <div class="category-card" onclick="window.location.href='category.html?category=${encodeURIComponent(c.name)}'">
                      <img src="${getImageUrl(c.image)}" alt="${c.name}" onerror="this.src='https://via.placeholder.com/400x300?text=Category'">
                      <div class="category-card-overlay"></div>
                      <div class="category-card-content">
                        <div class="category-card-name">${c.name}</div>
                        <div class="category-card-count">${count} product${count !== 1 ? 's' : ''}</div>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        `;

      } catch (err) {
        console.error(err);
        content.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h4>Error loading categories</h4></div>`;
      }
    }

    // RENDER PRODUCT CARD
    function renderProductCard(p) {
      const rating = (p.rating || 4).toFixed(1);
      const safeName = (p.name || '').replace(/'/g, "\\'");
      const safeImage = getImageUrl(p.image).replace(/'/g, "\\'");

      return `
        <div class="col-lg-3 col-md-4 col-sm-6">
          <div class="product-card">
            <a href="product_detail.html?id=${p.id}">
              <img src="${getImageUrl(p.image)}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/600x400?text=Product'">
            </a>
            <div class="product-body">
              <a href="product_detail.html?id=${p.id}" style="color:inherit;">
                <div class="product-title">${p.name}</div>
              </a>
              <div class="product-price">₹${p.price}</div>
              <div class="product-rating">
                <i class="fa-solid fa-star"></i> ${rating}
              </div>
              <button class="btn-add" onclick="addToCart('${p.id}', '${safeName}', ${p.price}, '${safeImage}')">
                <i class="fa-solid fa-cart-plus"></i> Add to Cart
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // ADD TO CART
    async function addToCart(id, name, price, image) {
      const userId = localStorage.getItem("userId") || "guest";

      try {
        const res = await fetch(`${API_URL}/cart/add`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId, productId: id, name, price, quantity: 1, image })
        });

        const data = await res.json();

        if (data.success) {
          const count = data.cart.reduce((s, i) => s + i.quantity, 0);
          localStorage.setItem("cartCount", count);
          updateCartBadge();
          showToast(`${name} added to cart`);
        }
      } catch (err) {
        console.error(err);
        alert("Error adding to cart");
      }
    }

    // UPDATE CART BADGE
    async function updateCartBadge() {
      const badge = document.getElementById("cartCountBadge");
      const userId = localStorage.getItem("userId") || "guest";

      try {
        const res = await fetch(`${API_URL}/cart/${userId}`);
        const data = await res.json();

        if (data.success && data.cart) {
          const count = data.cart.reduce((s, i) => s + (i.quantity || 1), 0);
          badge.textContent = count > 9 ? "9+" : count;
          localStorage.setItem("cartCount", count);
        }
      } catch (err) {
        badge.textContent = localStorage.getItem("cartCount") || "0";
      }
    }
  </script>

</body>
</html>
